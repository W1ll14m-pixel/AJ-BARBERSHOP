<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>

  <!-- Scissors icon -->
  <!-- Upper blade -->
  <g transform="translate(256,256) rotate(-45)">
    <!-- Blade 1 -->
    <ellipse cx="-8" cy="-95" rx="9" ry="72" fill="#ffffff"/>
    <circle cx="-8" cy="-20" r="22" fill="none" stroke="#ffffff" stroke-width="12"/>
    <circle cx="-8" cy="-20" r="7" fill="#0a0a0a"/>
    <!-- Blade 2 -->
    <ellipse cx="8" cy="-95" rx="9" ry="72" fill="#ffffff"/>
    <circle cx="8" cy="-20" r="22" fill="none" stroke="#ffffff" stroke-width="12"/>
    <circle cx="8" cy="-20" r="7" fill="#0a0a0a"/>
    <!-- Handle 1 -->
    <ellipse cx="-18" cy="80" rx="18" ry="52" fill="#ffffff"/>
    <!-- Handle 2 -->
    <ellipse cx="18" cy="80" rx="18" ry="52" fill="#ffffff"/>
    <!-- Pivot -->
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>

  <!-- AJ text -->
  <text x="256" y="468"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="52"
        font-weight="700"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="10">AJ</text>
</svg>
